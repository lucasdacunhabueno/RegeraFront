name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:
    inputs:
      sha:
        description: "SHA da imagem a (re)publicar (rollback)"
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/lucasdacunhabueno/regera-front

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx ng lint
      - run: npx ng test --watch=false
      - run: npx ng build

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: image
    if: ${{ !failure() && !cancelled() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-front
    steps:
      - name: Validar sha
        env:
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "sha inválido: '$SHA' (use os 40 caracteres)"
            exit 1
          fi
      - name: Publicar
        uses: appleboy/ssh-action@v1
        env:
          SHA: ${{ inputs.sha || github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: SHA
          script: /opt/regera/deploy.sh front "$SHA"
